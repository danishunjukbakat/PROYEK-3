<!doctype html><html lang="id"><meta charset="utf-8"><title>Local Storage dasar</title><link rel="stylesheet" href="../style.css"><main><h1>API Local Storage</h1><label>Nama <input id="nama" maxlength="100"></label><button id="simpan">Simpan nama</button><button id="baca">Baca nama</button><button id="hapus">Hapus nama</button><p id="hasil" aria-live="polite"></p><label>Tema <select id="tema"><option value="light">Terang</option><option value="dark">Gelap</option></select></label><p>Refresh setelah mengganti tema. Local Storage dibatasi origin (skema + host + port).</p><pre>localStorage.setItem('modul4_nama', 'Danish');
localStorage.getItem('modul4_nama');
localStorage.removeItem('modul4_nama');</pre></main><script>
const hasil=document.querySelector('#hasil');
function safe(fn){try{fn()}catch(e){hasil.textContent='Storage tidak tersedia: '+e.message}}
document.querySelector('#simpan').onclick=()=>safe(()=>{localStorage.setItem('modul4_nama',document.querySelector('#nama').value);hasil.textContent='Nama disimpan.'});
document.querySelector('#baca').onclick=()=>safe(()=>{hasil.textContent=localStorage.getItem('modul4_nama')??'(belum ada)'});
document.querySelector('#hapus').onclick=()=>safe(()=>{localStorage.removeItem('modul4_nama');hasil.textContent='Nama dihapus.'});
const tema=document.querySelector('#tema');function apply(t){document.body.classList.toggle('dark',t==='dark');tema.value=t==='dark'?'dark':'light'}
safe(()=>apply(localStorage.getItem('modul4_tema')??'light'));
tema.onchange=()=>safe(()=>{localStorage.setItem('modul4_tema',tema.value);apply(tema.value)});
</script></html>
